                                { q: "What makes blockchain secure?", opts: ["Banks.", "Government regulation.", "Cryptography.", "Computers on one server."], correct: 2, hint: "Where does security come from?", exp: "Cryptography." },
                                { q: "What is the benefit of blockchain?", opts: ["It is fast.", "It fosters trust without middlemen.", "It is free.", "It increases internet speed."], correct: 1, hint: "What is the benefit over banks?", exp: "Trust without needing a middleman." },
                                { q: "Where does it store data?", opts: ["One server.", "Across a network.", "In a paper ledger.", "On your phone only."], correct: 1, hint: "How does it store info?", exp: "Across a network of computers." }
                            ]
                        }
                    ]
                }
            ]
        },
        speaking: {
            title: "Speaking Section",
            modules: [
                {
                    id: "s1", title: "Speaking Tasks",
                    tasks: [
                        {
                            id: "s_t1", type: "speak_repeat", title: "Task 1: Listen and Repeat",
                            instructions: "You will hear 7 phrases related to environmental sustainability. You must repeat each phrase exactly into your microphone in 15 seconds.",
                            phrases: [
                                "The campus green project aims to reduce carbon emissions by ten percent.",
                                "Sustainable agriculture practices can help maintain long-term soil health.",
                                "Please remember to separate your recyclables in the designated bins.",
                                "Renewable energy sources are essential for a cleaner and healthier future.",
                                "The environmental research lab focuses on studying renewable resources.",
                                "Water conservation efforts on campus have yielded significant positive results.",
                                "Developing eco-friendly transportation is a key goal of our university initiative."
                            ]
                        },
                        {
                            id: "s_t2", type: "speak_interview", title: "Task 2: Take an Interview",
                            instructions: "The interviewer will ask 4 questions about your views on work-life balance and studies.",
                            questions: [
                                "Do you believe it is important to dedicate extra hours to your studies, or should students prioritize personal rest and well-being? Why?",
                                "When working in a team, do you prefer to take on leadership roles or support the team in smaller ways? Please elaborate.",
                                "How do you handle pressure when deadlines are fast approaching and you have too much work to do?",
                                "What role do you think extracurricular activities play in a student's personal and professional development?"
                            ]
                        }
                    ]
                }
            ]
        },
        writing: {
            title: "Writing Section",
            modules: [
                {
                    id: "w1", title: "Writing Tasks",
                    tasks: [
                        {
                            id: "w_t1", type: "write_sentence", title: "Task 1: Build a Sentence",
                            instructions: "Construct a grammatically correct sentence from the given components.",
                            items: [
                                { words: ["campus", "the", "library", "in", "is", "quiet"], correct: "The library on campus is quiet" },
                                { words: ["research", "paper", "needs", "more", "data", "The"], correct: "The research paper needs more data" },
                                { words: ["professor", "email", "sent", "a", "The", "students", "to"], correct: "The professor sent an email to students" },
                                { words: ["students", "group", "study", "the", "in", "meet"], correct: "The students meet in the study group" },
                                { words: ["exam", "for", "prepare", "you", "should", "your"], correct: "You should prepare for your exam" },
                                { words: ["university", "new", "The", "built", "lab", "a"], correct: "The university built a new lab" },
                                { words: ["are", "notes", "available", "The", "online"], correct: "The notes are available online" },
                                { words: ["advisor", "my", "contact", "must", "I"], correct: "I must contact my advisor" },
                                { words: ["science", "experiment", "The", "was", "finished"], correct: "The science experiment was finished" },
                                { words: ["campus", "events", "join", "to", "all", "students", "Can"], correct: "Can all students join campus events" }
                            ]
                        },
                        {
                            id: "w_t2", type: "write_email", title: "Task 2: Write an Email",
                            timeLimit: 420,
                            instructions: "You have 7 minutes to write a formal email to your academic advisor regarding your course schedule. In your email, you must include the following 3 aspects:\n1) Explain why you need to drop the current Biology course.\n2) Suggest two alternative courses you would like to take.\n3) Ask for an appointment to meet this week.\n\nAn effective response should be around 100 words."
                        },
                        {
                            id: "w_t3", type: "write_academic", title: "Task 3: Academic Discussion",
                            timeLimit: 600,
                            instructions: "You have 10 minutes. Read the professor's post and the two student responses. Then, contribute to the discussion.\n\nIn your response, you should do the following:\n- Express and support your opinion.\n- Make a contribution to the discussion in your own words.\n\nAn effective response will contain at least 100 words.\nIn your response, you should do the following: Express and support your opinion; Make a contribution to the discussion in your own words. An effective response will contain at least 100 words.",
                            prof: "<strong>Professor Diaz:</strong> This week, we are discussing the role of mandatory volunteering in higher education. Some institutions now require students to complete a certain number of community service hours before graduation. Proponents argue this fosters civic responsibility and empathy. Critics maintain that forcing students to volunteer cheapens the act and may unfairly burden those who already balance work and studies. What is your perspective? Should community service be a requirement for graduation?",
                            student1: "<strong>Sarah:</strong> I feel that mandatory volunteering is a good idea. Many students are so focused on their degrees that they forget to engage with the actual problems in their communities. By requiring service, schools encourage us to step out of our bubbles and see the world from different perspectives. It shouldn't be about the hours, but about the impact we can make. It helps us build character and empathy.",
                            student2: "<strong>Mark:</strong> I strongly disagree. Forcing someone to volunteer turns an act of kindness into just another box to check. Many students are already working part-time jobs and taking full course loads. Adding another mandatory obligation just adds stress and might result in students performing service poorly just to get it over with. Volunteering should be done out of free will, not under pressure from the university."
                        }
                    ]
                }
            ]
        }
    };

    // --- STATE ---
    let currentSection = 'reading';
    let currentModule = 0;
    let currentTask = 0;
    let globalSeconds = 0;
    let timerInterval;
    let recognition;
    let speakingTranscripts = {};
    let scores = { reading: {correct:0, total:0}, listening: {correct:0, total:0} };

    // --- INIT ---
    function init() {
        startTimer();
        setupSpeechRecognition();
        renderSidebar();
        renderTask();
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            globalSeconds++;
            const mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
            const secs = (globalSeconds % 60).toString().padStart(2, '0');
            document.getElementById('global-timer').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function changeSection(section) {
        currentSection = section;
        currentModule = 0;
        currentTask = 0;
        ['reading', 'listening', 'speaking', 'writing', 'results'].forEach(s => {
            const btn = document.getElementById(`nav-${s}`);
            if(s === section) { btn.classList.add('tab-active'); btn.classList.remove('text-gray-500'); } 
            else { btn.classList.remove('tab-active'); btn.classList.add('text-gray-500'); }
        });
        if (section === 'results') { document.getElementById('sidebar').innerHTML = ''; renderResults(); } 
        else { renderSidebar(); renderTask(); }
    }

    function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '';
        const sectionData = examData[currentSection];
        sectionData.modules.forEach((mod, mIndex) => {
            const modDiv = document.createElement('div');
            modDiv.className = 'py-2 px-4 font-bold text-gray-700 bg-gray-100 border-b';
            modDiv.innerText = mod.title;
            sidebar.appendChild(modDiv);
            mod.tasks.forEach((task, tIndex) => {
                const taskBtn = document.createElement('button');
                taskBtn.className = `w-full text-left py-2 px-6 text-sm hover:bg-gray-200 ${mIndex === currentModule && tIndex === currentTask ? 'subtab-active' : ''}`;
                taskBtn.innerText = task.title;
                taskBtn.onclick = () => { currentModule = mIndex; currentTask = tIndex; renderSidebar(); renderTask(); };
                sidebar.appendChild(taskBtn);
            });
        });
    }

    function renderTask() {
        const content = document.getElementById('main-content');
        const task = examData[currentSection].modules[currentModule].tasks[currentTask];
        let html = `<h2 class="text-2xl font-bold mb-6 text-blue-800">${task.title}</h2>`;
        
        if (task.type === 'complete_words') {
            html += `<div class="bg-white p-6 rounded shadow-sm border border-gray-200 text-lg leading-relaxed mb-6">${task.text}</div>
            <div class="flex gap-4"><button onclick="checkCompleteWords('${task.id}')" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Comprobar Respuestas</button><button onclick="showHintsCompleteWords('${task.id}')" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">Ver Pistas</button></div><div id="feedback-${task.id}" class="mt-4"></div>`;
        } else if (task.type === 'daily_life' || task.type === 'academic') {
            html += task.passage ? renderPassageAndQuestions(task) : task.subtasks.map((sub, idx) => `<h3 class="text-xl font-bold mt-8 mb-4 border-b pb-2">${sub.title}</h3>` + renderPassageAndQuestions(sub, `${task.id}_sub${idx}`)).join('');
        } else if (task.type === 'listen_choose') {
            html += `<p class="mb-4 text-gray-600"><i class="fa-solid fa-headphones"></i> ${task.instructions}</p>` + task.items.map((item, idx) => `
                <div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-4"><div class="flex items-center gap-4 mb-4"><span class="font-bold">Item ${idx+1}:</span><button onclick="playAudio('${item.audio.text.replace(/'/g, "\\'")}', '${item.audio.speaker}')" class="bg-green-500 text-white px-3 py-1 rounded-full hover:bg-green-600"><i class="fa-solid fa-play"></i> Play</button></div>
                <div class="space-y-2 pl-4">${item.opts.map((opt, oIdx) => `<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="q_${task.id}_${idx}" value="${oIdx}"> <span>${opt}</span></label>`).join('')}</div>
                <div class="mt-4 flex gap-2"><button onclick="checkSingleMCQ('${task.id}_${idx}', ${item.correct}, '${item.exp.replace(/'/g, "\\'")}')" class="text-sm bg-blue-100 text-blue-700 px-3 py-1 rounded">Comprobar</button></div>
                <div id="fb_${task.id}_${idx}" class="mt-2 text-sm"></div></div>`).join('');
        } else if (task.type === 'listen_announcement' || task.type === 'listen_talk') {
            html += `<p class="mb-4 text-gray-600"><i class="fa-solid fa-headphones"></i> ${task.instructions}</p><div class="bg-white p-6 rounded shadow-sm border border-gray-200 mb-6 flex justify-center"><button onclick="playAudio('${task.audio.text.replace(/'/g, "\\'")}', '${task.audio.speaker}')" class="bg-green-500 text-white px-8 py-4 rounded-full text-xl hover:bg-green-600"><i class="fa-solid fa-play mr-2"></i> Play Audio</button></div>` + renderOnlyQuestions(task.questions, task.id);
        } else if (task.type === 'listen_convo') {
            html += `<p class="mb-4 text-gray-600"><i class="fa-solid fa-headphones"></i> ${task.instructions}</p>` + task.subtasks.map((sub, idx) => `<h3 class="text-xl font-bold mt-8 mb-4 border-b pb-2">${sub.title}</h3><div class="bg-white p-6 rounded shadow-sm border border-gray-200 mb-6 flex justify-center"><button onclick="playConversation(decodeURIComponent('${encodeURIComponent(JSON.stringify(sub.audio))}'))" class="bg-green-500 text-white px-6 py-3 rounded-full hover:bg-green-600"><i class="fa-solid fa-play mr-2"></i> Play Conversation</button></div>` + renderOnlyQuestions(sub.questions, `${task.id}_sub${idx}`)).join('');
        } else if (task.type === 'speak_repeat') {
            html += `<div class="bg-yellow-50 p-4 border-l-4 border-yellow-400 mb-6">${task.instructions}</div>` + task.phrases.map((phrase, idx) => `<div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-4 flex items-center justify-between"><div><span class="font-bold text-gray-500 mr-2">#${idx+1}</span><button onclick="playAudio('${phrase.replace(/'/g, "\\'")}', 'woman')" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300"><i class="fa-solid fa-volume-high"></i> Listen</button></div><div class="flex items-center gap-4"><span id="timer_sr_${idx}" class="font-mono text-lg font-bold text-gray-700">15s</span><button id="btn_sr_${idx}" onclick="startSpeakingTask('sr_${idx}', 15)" class="bg-red-500 text-white px-4 py-2 rounded shadow hover:bg-red-600"><i class="fa-solid fa-microphone"></i> Record</button></div></div><div id="transcript_sr_${idx}" class="text-sm italic text-gray-600 mb-4 ml-4"></div>`).join('');
        } else if (task.type === 'speak_interview') {
            html += `<div class="bg-yellow-50 p-4 border-l-4 border-yellow-400 mb-6">${task.instructions}</div>` + task.questions.map((q, idx) => `<div class="bg-white p-6 rounded shadow-sm border border-gray-200 mb-4"><div class="mb-4"><button onclick="playAudio('${q.replace(/'/g, "\\'")}', 'man')" class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300 mb-2"><i class="fa-solid fa-volume-high"></i> Listen to Interviewer</button></div><div class="flex items-center justify-between bg-gray-50 p-4 rounded"><span class="text-gray-600 font-semibold">Your Response:</span><div class="flex items-center gap-4"><span id="timer_si_${idx}" class="font-mono text-2xl font-bold text-gray-700">45s</span><button id="btn_si_${idx}" onclick="startSpeakingTask('si_${idx}', 45)" class="bg-red-500 text-white px-6 py-2 rounded-full shadow hover:bg-red-600"><i class="fa-solid fa-microphone"></i> Start Answer</button></div></div><div id="transcript_si_${idx}" class="mt-4 text-sm italic text-blue-800 bg-blue-50 p-2 rounded hidden"></div></div>`).join('');
        } else if (task.type === 'write_sentence') {
            html += `<p class="mb-4 text-gray-600">${task.instructions}</p>` + task.items.map((item, idx) => { const shuffled = [...item.words].sort(() => Math.random() - 0.5); return `<div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-6"><p class="font-bold mb-2">Sentence ${idx+1}:</p><div class="flex flex-wrap gap-2 mb-4" id="source_${idx}">${shuffled.map((w, wIdx) => `<span draggable="true" ondragstart="drag(event)" id="word_${idx}_${wIdx}" class="word-chip bg-blue-100 text-blue-800 px-3 py-1 rounded shadow-sm">${w}</span>`).join('')}</div><div class="drop-zone p-2 bg-gray-50 flex flex-wrap gap-2 items-center" id="target_${idx}" ondrop="drop(event)" ondragover="allowDrop(event)"><span class="text-gray-400 text-sm pointer-events-none">Drag words here...</span></div><button onclick="checkSentence(${idx}, '${item.correct.replace(/'/g, "\\'")}')" class="mt-4 text-sm bg-blue-600 text-white px-3 py-1 rounded">Comprobar</button><div id="fb_sent_${idx}" class="mt-2 text-sm"></div></div>`; }).join('');
        } else if (task.type === 'write_email') {
            html += `<div class="flex justify-between items-center mb-4"><p class="text-gray-600 whitespace-pre-line">${task.instructions}</p><div id="local-timer-email" class="text-2xl font-mono font-bold bg-gray-200 px-4 py-2 rounded">07:00</div></div><textarea id="email-text" class="w-full h-64 p-4 border rounded shadow-inner focus:outline-blue-500 resize-none" oninput="countWords('email-text', 'email-wc')"></textarea><div class="mt-2 text-right text-gray-500 font-bold">Word count: <span id="email-wc">0</span> / 100</div>`;
            setTimeout(() => startLocalTimer('email', task.timeLimit), 100);
        } else if (task.type === 'write_academic') {
            html += `<div class="flex justify-between items-center mb-4"><p class="text-gray-600 whitespace-pre-line">${task.instructions}</p><div id="local-timer-acad" class="text-2xl font-mono font-bold bg-gray-200 px-4 py-2 rounded">10:00</div></div><div class="bg-white p-4 rounded border mb-4 text-sm space-y-4 shadow-sm"><div class="bg-gray-50 p-3 rounded">${task.prof}</div><div class="bg-blue-50 p-3 rounded ml-8">${task.student1}</div><div class="bg-green-50 p-3 rounded ml-8">${task.student2}</div></div><textarea id="acad-text" class="w-full h-48 p-4 border rounded shadow-inner focus:outline-blue-500 resize-none" oninput="countWords('acad-text', 'acad-wc')"></textarea><div class="mt-2 text-right text-gray-500 font-bold">Word count: <span id="acad-wc">0</span></div>`;
            setTimeout(() => startLocalTimer('acad', task.timeLimit), 100);
        }
        content.innerHTML = html;
    }

    function renderPassageAndQuestions(task, idPrefix = task.id) {
        return `<div class="flex flex-col lg:flex-row gap-6 mb-8"><div class="lg:w-1/2 bg-white p-6 rounded shadow-sm border border-gray-200 max-h-[600px] text-lg overflow-y-auto">${task.passage}</div><div class="lg:w-1/2 flex flex-col gap-6 max-h-[600px] overflow-y-auto">${task.questions.map((q, idx) => `<div class="bg-white p-4 rounded shadow-sm border border-gray-200"><p class="font-bold mb-3">${idx+1}. ${q.q}</p><div class="space-y-2">${q.opts.map((opt, oIdx) => `<label class="flex items-center gap-2 cursor-pointer p-2 hover:bg-gray-50 rounded"><input type="radio" name="q_${idPrefix}_${idx}" value="${oIdx}"> <span>${opt}</span></label>`).join('')}</div><div class="mt-4 flex gap-2"><button onclick="checkMCQ('${idPrefix}_${idx}', ${q.correct}, '${q.exp.replace(/'/g, "\\'")}', '${currentSection}')" class="text-sm bg-blue-600 text-white px-3 py-1 rounded">Comprobar</button><button onclick="showHint('fb_${idPrefix}_${idx}', '${q.hint.replace(/'/g, "\\'")}')" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded">Pista</button></div><div id="fb_${idPrefix}_${idx}" class="mt-2 text-sm"></div></div>`).join('')}</div></div>`;
    }

    function renderOnlyQuestions(questions, idPrefix) {
        return `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">${questions.map((q, idx) => `<div class="bg-white p-4 rounded shadow-sm border border-gray-200"><p class="font-bold mb-3">${idx+1}. ${q.q}</p><div class="space-y-2">${q.opts.map((opt, oIdx) => `<label class="flex items-center gap-2 cursor-pointer p-2 hover:bg-gray-50 rounded"><input type="radio" name="q_${idPrefix}_${idx}" value="${oIdx}"> <span>${opt}</span></label>`).join('')}</div><div class="mt-4 flex gap-2"><button onclick="checkMCQ('${idPrefix}_${idx}', ${q.correct}, '${q.exp.replace(/'/g, "\\'")}', '${currentSection}')" class="text-sm bg-blue-600 text-white px-3 py-1 rounded">Comprobar</button><button onclick="showHint('fb_${idPrefix}_${idx}', '${q.hint.replace(/'/g, "\\'")}')" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded">Pista</button></div><div id="fb_${idPrefix}_${idx}" class="mt-2 text-sm"></div></div>`).join('')}</div>`;
    }

    function checkCompleteWords(taskId) {
        const task = examData.reading.modules[0].tasks[0];
        scores.reading.total += task.answers.length;
        let html = task.answers.map((ans, idx) => {
            const input = document.getElementById(`cw_${idx+1}`).value.trim().toLowerCase();
            return input === ans.toLowerCase() ? `<div class="text-green-600"><i class="fa-solid fa-check"></i> <b>Hueco ${idx+1}:</b> Correcto. ${task.explanations[idx]}</div>` : `<div class="text-red-600"><i class="fa-solid fa-xmark"></i> <b>Hueco ${idx+1}:</b> Incorrecto. Era '${ans}'. ${task.explanations[idx]}</div>`;
        }).join('');
        scores.reading.correct += (html.match(/Correcto/g) || []).length;
        document.getElementById(`feedback-${taskId}`).innerHTML = `<div class="bg-gray-50 p-4 border rounded mt-4">${html}</div>`;
    }

    function showHintsCompleteWords(taskId) {
        const task = examData.reading.modules[0].tasks[0];
        document.getElementById(`feedback-${taskId}`).innerHTML = `<div class="bg-blue-50 p-4 border border-blue-200 rounded mt-4"><b>Pistas:</b><br>${task.hints.map((h, i) => `Hueco ${i+1}: ${h}`).join('<br>')}</div>`;
    }

    function checkMCQ(qId, correctIdx, exp, section) {
        scores[section] = scores[section] || {correct:0, total:0};
        const selected = document.querySelector(`input[name="q_${qId}"]:checked`);
        if (!selected) return;
        if (parseInt(selected.value) === correctIdx) { scores[section].correct++; }
        scores[section].total++;
        const fbDiv = document.getElementById(`fb_${qId}`);
        fbDiv.innerHTML = parseInt(selected.value) === correctIdx ? `<div class="feedback-correct"><b>¡Correcto!</b> ${exp}</div>` : `<div class="feedback-incorrect"><b>Incorrecto.</b> ${exp}</div>`;
        document.querySelectorAll(`input[name="q_${qId}"]`).forEach(el => el.disabled = true);
    }

    function checkSingleMCQ(qId, correctIdx, exp) { checkMCQ(qId, correctIdx, exp, 'listening'); }
    function showHint(fbId, hint) { document.getElementById(fbId).innerHTML = `<div class="text-blue-600 bg-blue-50 p-2 rounded mt-2">Pista: ${hint}</div>`; }
    function playAudio(text, gender) { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.pitch = gender === 'man' ? 0.5 : 1.2; window.speechSynthesis.speak(u); }
    function playConversation(convoJson) { window.speechSynthesis.cancel(); const convo = JSON.parse(convoJson); let i = 0; function s() { if (i < convo.length) { const u = new SpeechSynthesisUtterance(convo[i].text); u.lang = 'en-US'; u.pitch = convo[i].speaker === 'man' ? 0.5 : 1.2; u.onend = s; window.speechSynthesis.speak(u); i++; } } s(); }
    
    function setupSpeechRecognition() { if ('webkitSpeechRecognition' in window) { recognition = new webkitSpeechRecognition(); recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US'; } }
    
    function startSpeakingTask(taskId, seconds) {
        const btn = document.getElementById(`btn_${taskId}`);
        const timerDisplay = document.getElementById(`timer_${taskId}`);
        const transcriptDiv = document.getElementById(`transcript_${taskId}`);
        btn.disabled = true; btn.innerHTML = `Recording...`; transcriptDiv.classList.remove('hidden');
        if (recognition) { 
            let final = ""; recognition.onresult = (e) => { for(let i=e.resultIndex; i<e.results.length; ++i) if(e.results[i].isFinal) final += e.results[i][0].transcript + " "; transcriptDiv.innerHTML = `<b>You said:</b> ${final}`; speakingTranscripts[taskId] = final; }; recognition.start(); 
        }
        let timeLeft = seconds;
        let int = setInterval(() => { timeLeft--; timerDisplay.innerText = `${timeLeft}s`; if (timeLeft <= 0) { clearInterval(int); if (recognition) recognition.stop(); btn.innerHTML = `Done`; } }, 1000);
    }

    function countWords(inputId, outputId) { const words = document.getElementById(inputId).value.trim().split(/\s+/).filter(w => w.length > 0).length; document.getElementById(outputId).innerText = words; }
    function startLocalTimer(type, seconds) { let timeLeft = seconds; setInterval(() => { timeLeft--; const m = Math.floor(timeLeft / 60).toString().padStart(2,'0'); const s = (timeLeft % 60).toString().padStart(2,'0'); document.getElementById(`local-timer-${type}`).innerText = timeLeft >= 0 ? `${m}:${s}` : `Overtime: +${Math.abs(timeLeft)}`; }, 1000); }
    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    function drop(ev) { ev.preventDefault(); ev.target.appendChild(document.getElementById(ev.dataTransfer.getData("text"))); }
    function checkSentence(idx, correctStr) { const chips = document.getElementById(`target_${idx}`).querySelectorAll('.word-chip'); const formed = Array.from(chips).map(c => c.innerText).join(' '); document.getElementById(`fb_sent_${idx}`).innerHTML = formed === correctStr ? `<div class="feedback-correct">Correct!</div>` : `<div class="feedback-incorrect">Incorrect. Should be: ${correctStr}</div>`; }
    function renderResults() { document.getElementById('main-content').innerHTML = `<div class="max-w-4xl mx-auto"><h2 class="text-3xl font-bold mb-8">Exam Results</h2><div class="grid grid-cols-2 gap-8 mb-8"><div class="bg-white p-6 rounded shadow text-center"><h3>Reading</h3><p class="text-4xl font-bold">${scores.reading.correct} / ${scores.reading.total}</p></div><div class="bg-white p-6 rounded shadow text-center"><h3>Listening</h3><p class="text-4xl font-bold">${scores.listening.correct} / ${scores.listening.total}</p></div></div><h3 class="font-bold">Speaking Transcripts:</h3>${Object.entries(speakingTranscripts).map(([id, t]) => `<p>Task ${id}: ${t}</p>`).join('')}</div>`; }
    window.onload = init;
