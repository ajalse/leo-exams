    // --- STATE ---
    let currentSection = 'reading';

    // --- INIT ---
    function init() {
        startTimer();
        setupSpeechRecognition();
        renderSidebar();
        renderTask();
    }

    // --- TIMER ---
    function startTimer() {
        timerInterval = setInterval(() => {
            globalSeconds++;
            const mins = Math.floor(globalSeconds / 60).toString().padStart(2, '0');
            const secs = (globalSeconds % 60).toString().padStart(2, '0');
            document.getElementById('global-timer').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    // --- NAVIGATION ---
    function changeSection(section) {
        currentSection = section;
        currentModule = 0;
        currentTask = 0;
        
        ['reading', 'listening', 'speaking', 'writing', 'results'].forEach(s => {
            const btn = document.getElementById(`nav-${s}`);
            if(s === section) {
                btn.classList.add('tab-active');
                btn.classList.remove('text-gray-500');
            } else {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-500');
            }
        });
        
        if (section === 'results') {
            document.getElementById('sidebar').innerHTML = '';
            renderResults();
        } else {
            renderSidebar();
            renderTask();
        }
    }

    function renderSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.innerHTML = '';
        const sectionData = examData[currentSection];
        
        sectionData.modules.forEach((mod, mIndex) => {
            const modDiv = document.createElement('div');
            modDiv.className = 'py-2 px-4 font-bold text-gray-700 bg-gray-100 border-b';
            modDiv.innerText = mod.title;
            sidebar.appendChild(modDiv);

            mod.tasks.forEach((task, tIndex) => {
                const taskBtn = document.createElement('button');
                taskBtn.className = `w-full text-left py-2 px-6 text-sm hover:bg-gray-200 ${mIndex === currentModule && tIndex === currentTask ? 'subtab-active' : ''}`;
                taskBtn.innerText = task.title;
                taskBtn.onclick = () => {
                    currentModule = mIndex;
                    currentTask = tIndex;
                    renderSidebar();
                    renderTask();
                };
                sidebar.appendChild(taskBtn);
            });
        });
    }

        else if (task.type === 'write_sentence') {
            html += `<p class="mb-4 text-gray-600">${task.instructions}</p>`;
            task.items.forEach((item, idx) => {
                const shuffled = [...item.words].sort(() => Math.random() - 0.5);
                html += `
                <div class="bg-white p-4 rounded shadow-sm border border-gray-200 mb-6">
                    <p class="font-bold mb-2">Sentence ${idx+1}:</p>
                    <div class="flex flex-wrap gap-2 mb-4" id="source_${idx}">
                        ${shuffled.map((w, wIdx) => `<span draggable="true" ondragstart="drag(event)" id="word_${idx}_${wIdx}" class="word-chip bg-blue-100 text-blue-800 px-3 py-1 rounded shadow-sm">${w}</span>`).join('')}
                    </div>
                    <div class="drop-zone p-2 bg-gray-50 flex flex-wrap gap-2 items-center" id="target_${idx}" ondrop="drop(event)" ondragover="allowDrop(event)">
                        <span class="text-gray-400 text-sm pointer-events-none">Arrastra las palabras aquí...</span>
                    </div>
                    <button onclick="checkSentence(${idx}, '${item.correct.replace(/'/g, "\\'")}')" class="mt-4 text-sm bg-blue-600 text-white px-3 py-1 rounded">Comprobar</button>
                    <div id="fb_sent_${idx}" class="mt-2 text-sm"></div>
                </div>`;
            });
        }
        else if (task.type === 'write_email') {
            html += `
                <div class="flex justify-between items-center mb-4">
                    <p class="text-gray-600 whitespace-pre-line">${task.instructions}</p>
                    <div id="local-timer-email" class="text-2xl font-mono font-bold bg-gray-200 px-4 py-2 rounded">07:00</div>
                </div>
                <textarea id="email-text" class="w-full h-64 p-4 border rounded shadow-inner focus:outline-blue-500 resize-none" placeholder="Start typing your email here..." oninput="countWords('email-text', 'email-wc')"></textarea>
                <div class="mt-2 text-right text-gray-500 font-bold">Word count: <span id="email-wc">0</span></div>
            `;
            setTimeout(() => startLocalTimer('email', task.timeLimit), 100);
        }
        else if (task.type === 'write_academic') {
            html += `
                <div class="flex justify-between items-center mb-4">
                    <p class="text-gray-600 whitespace-pre-line">${task.instructions}</p>
                    <div id="local-timer-acad" class="text-2xl font-mono font-bold bg-gray-200 px-4 py-2 rounded">10:00</div>
                </div>
                <div class="bg-white p-4 rounded border mb-4 text-sm space-y-4 shadow-sm">
                    <div class="bg-gray-50 p-3 rounded">${task.prof}</div>
                    <div class="bg-blue-50 p-3 rounded ml-8">${task.student1}</div>
                    <div class="bg-green-50 p-3 rounded ml-8">${task.student2}</div>
                </div>
                <textarea id="acad-text" class="w-full h-48 p-4 border rounded shadow-inner focus:outline-blue-500 resize-none" placeholder="Write your post here..." oninput="countWords('acad-text', 'acad-wc')"></textarea>
                <div class="mt-2 text-right text-gray-500 font-bold">Word count: <span id="acad-wc">0</span></div>
            `;
            setTimeout(() => startLocalTimer('acad', task.timeLimit), 100);
        }

        content.innerHTML = html;
    }

    // --- RENDER HELPERS ---
    function renderPassageAndQuestions(task, idPrefix = task.id) {
        let html = `<div class="flex flex-col lg:flex-row gap-6 mb-8">`;
        html += `<div class="lg:w-1/2 bg-white p-6 rounded shadow-sm border border-gray-200 overflow-y-auto max-h-[600px] text-lg leading-relaxed">${task.passage}</div>`;
        html += `<div class="lg:w-1/2 flex flex-col gap-6 overflow-y-auto max-h-[600px] pr-2">`;
        task.questions.forEach((q, idx) => {
            html += `
            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                <p class="font-bold mb-3">${idx+1}. ${q.q}</p>
                <div class="space-y-2">
                    ${q.opts.map((opt, oIdx) => `
                        <label class="flex items-center gap-2 cursor-pointer p-2 hover:bg-gray-50 rounded">
                            <input type="radio" name="q_${idPrefix}_${idx}" value="${oIdx}">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
                <div class="mt-4 flex gap-2">
                    <button onclick="checkMCQ('${idPrefix}_${idx}', ${q.correct}, '${q.exp.replace(/'/g, "\\'")}', '${currentSection}')" class="text-sm bg-blue-600 text-white px-3 py-1 rounded">Comprobar</button>
                    <button onclick="showHint('fb_${idPrefix}_${idx}', '${q.hint.replace(/'/g, "\\'")}')" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded">Pista</button>
                </div>
                <div id="fb_${idPrefix}_${idx}" class="mt-2 text-sm"></div>
            </div>`;
        });
        html += `</div></div>`;
        return html;
    }

    function renderOnlyQuestions(questions, idPrefix) {
        let html = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6">`;
        questions.forEach((q, idx) => {
            html += `
            <div class="bg-white p-4 rounded shadow-sm border border-gray-200">
                <p class="font-bold mb-3">${idx+1}. ${q.q}</p>
                <div class="space-y-2">
                    ${q.opts.map((opt, oIdx) => `
                        <label class="flex items-center gap-2 cursor-pointer p-2 hover:bg-gray-50 rounded">
                            <input type="radio" name="q_${idPrefix}_${idx}" value="${oIdx}">
                            <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
                <div class="mt-4 flex gap-2">
                    <button onclick="checkMCQ('${idPrefix}_${idx}', ${q.correct}, '${q.exp.replace(/'/g, "\\'")}', '${currentSection}')" class="text-sm bg-blue-600 text-white px-3 py-1 rounded">Comprobar</button>
                    <button onclick="showHint('fb_${idPrefix}_${idx}', '${q.hint.replace(/'/g, "\\'")}')" class="text-sm bg-gray-200 text-gray-700 px-3 py-1 rounded">Pista</button>
                </div>
                <div id="fb_${idPrefix}_${idx}" class="mt-2 text-sm"></div>
            </div>`;
        });
        html += `</div>`;
        return html;
    }

    // --- INTERACTION LOGIC ---
    function checkCompleteWords(taskId) {
        const task = examData.reading.modules[0].tasks[0];
        scores.reading.total += task.answers.length;
        let html = "";
        let correctCount = 0;
        task.answers.forEach((ans, idx) => {
            const input = document.getElementById(`cw_${idx+1}`).value.trim().toLowerCase();
            if (input === ans.toLowerCase()) {
                correctCount++;
                html += `<div class="text-green-600"><i class="fa-solid fa-check"></i> <b>Hueco ${idx+1}:</b> Correcto. ${task.explanations[idx]}</div>`;
            } else {
                html += `<div class="text-red-600"><i class="fa-solid fa-xmark"></i> <b>Hueco ${idx+1}:</b> Incorrecto. Era '${ans}'. ${task.explanations[idx]}</div>`;
            }
        });
        scores.reading.correct += correctCount;
        document.getElementById(`feedback-${taskId}`).innerHTML = `<div class="bg-gray-50 p-4 border rounded mt-4">${html}</div>`;
    }

    function showHintsCompleteWords(taskId) {
        const task = examData.reading.modules[0].tasks[0];
        let html = "<b>Pistas:</b><br>";
        task.hints.forEach((h, idx) => {
            html += `Hueco ${idx+1}: ${h}<br>`;
        });
        document.getElementById(`feedback-${taskId}`).innerHTML = `<div class="bg-blue-50 p-4 border border-blue-200 rounded mt-4">${html}</div>`;
    }

    function checkMCQ(qId, correctIdx, exp, section) {
        scores[section] = scores[section] || {correct:0, total:0};
        scores[section].total++;
        
        const selected = document.querySelector(`input[name="q_${qId}"]:checked`);
        const fbDiv = document.getElementById(`fb_${qId}`);
        if (!selected) {
            fbDiv.innerHTML = `<span class="text-orange-500">Por favor selecciona una respuesta.</span>`;
            scores[section].total--; 
            return;
        }
        if (parseInt(selected.value) === correctIdx) {
            scores[section].correct++;
            fbDiv.innerHTML = `<div class="feedback-correct"><i class="fa-solid fa-check"></i> <b>¡Correcto!</b> ${exp}</div>`;
        } else {
            fbDiv.innerHTML = `<div class="feedback-incorrect"><i class="fa-solid fa-xmark"></i> <b>Incorrecto.</b> ${exp}</div>`;
        }
        document.querySelectorAll(`input[name="q_${qId}"]`).forEach(el => el.disabled = true);
    }
    
    function checkSingleMCQ(qId, correctIdx, exp) {
        checkMCQ(qId, correctIdx, exp, 'listening');
    }

    function showHint(fbId, hint) {
        document.getElementById(fbId).innerHTML = `<div class="text-blue-600 bg-blue-50 p-2 rounded mt-2"><i class="fa-regular fa-lightbulb"></i> Pista: ${hint}</div>`;
    }

    // --- AUDIO (TTS) ---
    function playAudio(text, gender) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        
        if (gender === 'man') {
            utterance.pitch = 0.5; 
        } else {
            utterance.pitch = 1.2; 
        }
        window.speechSynthesis.speak(utterance);
    }

    function playConversation(convoJson) {
        const convo = JSON.parse(convoJson);
        window.speechSynthesis.cancel();
        
        let i = 0;
        function speakNext() {
            if (i < convo.length) {
                const utterance = new SpeechSynthesisUtterance(convo[i].text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;
                utterance.pitch = convo[i].speaker === 'man' ? 0.5 : 1.2;
                utterance.onend = speakNext;
                window.speechSynthesis.speak(utterance);
                i++;
            }
        }
        speakNext();
    }

    // --- SPEECH TO TEXT (STT) ---
    function setupSpeechRecognition() {
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
        } else {
            console.warn("Speech recognition not supported in this browser.");
        }
    }

    let currentRecTimer;
    function startSpeakingTask(taskId, seconds) {
        const btn = document.getElementById(`btn_${taskId}`);
        const timerDisplay = document.getElementById(`timer_${taskId}`);
        const transcriptDiv = document.getElementById(`transcript_${taskId}`);
        
        if (btn.disabled) return;
        
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Recording...`;
        btn.classList.replace('bg-red-500', 'bg-red-300');
        transcriptDiv.classList.remove('hidden');
        transcriptDiv.innerHTML = "Listening...";
        
        let finalTranscript = "";
        
        if (recognition) {
            recognition.onresult = (event) => {
                let interim = "";
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + " ";
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                transcriptDiv.innerHTML = `<b>You said:</b> ${finalTranscript} <i class="text-gray-400">${interim}</i>`;
                speakingTranscripts[taskId] = finalTranscript;
            };
            recognition.start();
        } else {
            transcriptDiv.innerHTML = "<i>Microphone not supported. Please pretend to speak.</i>";
        }

        let timeLeft = seconds;
        currentRecTimer = setInterval(() => {
            timeLeft--;
            timerDisplay.innerText = `${timeLeft}s`;
            if (timeLeft <= 0) {
                clearInterval(currentRecTimer);
                if (recognition) recognition.stop();
                btn.innerHTML = `<i class="fa-solid fa-check"></i> Done`;
                btn.classList.replace('bg-red-300', 'bg-gray-400');
                if(!speakingTranscripts[taskId]) speakingTranscripts[taskId] = "(No audio recorded)";
                transcriptDiv.innerHTML = `<b>Saved Transcript:</b> ${speakingTranscripts[taskId]}`;
            }
        }, 1000);
    }

    // --- WRITING TOOLS ---
    function countWords(inputId, outputId) {
        const text = document.getElementById(inputId).value;
        const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
        document.getElementById(outputId).innerText = words;
    }

    let localInterval;
    function startLocalTimer(type, seconds) {
        if(localInterval) clearInterval(localInterval);
        const display = document.getElementById(`local-timer-${type}`);
        let timeLeft = seconds;
        
        localInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft >= 0) {
                const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const s = (timeLeft % 60).toString().padStart(2, '0');
                display.innerText = `${m}:${s}`;
                display.classList.remove('overtime');
            } else {
                const over = Math.abs(timeLeft);
                const m = Math.floor(over / 60).toString().padStart(2, '0');
                const s = (over % 60).toString().padStart(2, '0');
                display.innerText = `Overtime: +${m}:${s}`;
                display.classList.add('overtime');
            }
        }, 1000);
    }

    function allowDrop(ev) { ev.preventDefault(); }
    function drag(ev) { ev.dataTransfer.setData("text", ev.target.id); }
    function drop(ev) {
        ev.preventDefault();
        var data = ev.dataTransfer.getData("text");
        if (ev.target.classList.contains('drop-zone') || ev.target.id.startsWith('source_')) {
            ev.target.appendChild(document.getElementById(data));
            const placeholder = ev.target.querySelector('span.pointer-events-none');
            if (placeholder) placeholder.remove();
        }
    }

    function checkSentence(idx, correctStr) {
        const target = document.getElementById(`target_${idx}`);
        const chips = target.querySelectorAll('.word-chip');
        let formed = Array.from(chips).map(c => c.innerText).join(' ');
        const fb = document.getElementById(`fb_sent_${idx}`);
        
        if (formed === correctStr) {
            fb.innerHTML = `<div class="feedback-correct"><i class="fa-solid fa-check"></i> <b>Correct!</b></div>`;
        } else {
            fb.innerHTML = `<div class="feedback-incorrect"><i class="fa-solid fa-xmark"></i> <b>Incorrect.</b> Should be: "${correctStr}"</div>`;
        }
    }

    // --- RESULTS ---
    function renderResults() {
        const content = document.getElementById('main-content');
        
        let html = `
        <div class="max-w-4xl mx-auto w-full">
            <h2 class="text-3xl font-bold mb-8 text-center text-blue-800">Exam Results Summary</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                <div class="bg-white p-6 rounded-lg shadow border border-gray-200 text-center">
                    <h3 class="text-xl font-bold mb-4 border-b pb-2">Reading</h3>
                    <div class="text-5xl font-bold text-blue-600 mb-2">${scores.reading.correct} <span class="text-2xl text-gray-400">/ ${scores.reading.total}</span></div>
                    <p class="text-gray-500">Correct Items Evaluated</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border border-gray-200 text-center">
                    <h3 class="text-xl font-bold mb-4 border-b pb-2">Listening</h3>
                    <div class="text-5xl font-bold text-blue-600 mb-2">${scores.listening.correct} <span class="text-2xl text-gray-400">/ ${scores.listening.total}</span></div>
                    <p class="text-gray-500">Correct Items Evaluated</p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow border border-gray-200 mb-8">
                <h3 class="text-xl font-bold mb-4 border-b pb-2">Speaking Transcripts</h3>
                <p class="text-sm text-gray-500 mb-4">Review what the system recorded during your speaking tasks.</p>
                <div class="space-y-4">
        `;
        
        let hasTranscripts = false;
        for (const [taskId, text] of Object.entries(speakingTranscripts)) {
            hasTranscripts = true;
            html += `<div class="bg-gray-50 p-3 rounded border"><span class="font-bold text-sm text-gray-700">Task ${taskId}:</span> <i class="text-blue-800">${text}</i></div>`;
        }
        if(!hasTranscripts) html += `<p class="italic text-gray-400">No speaking tasks recorded yet.</p>`;
        
        html += `
                </div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow border border-gray-200">
                <h3 class="text-xl font-bold mb-4 border-b pb-2">Writing Submissions</h3>
                <p class="italic text-gray-500 text-sm">Essays are recorded locally in the inputs during the session. An instructor would evaluate them based on rubrics.</p>
            </div>
        </div>`;
        
        content.innerHTML = html;
    }

    window.onload = init;

</script>
